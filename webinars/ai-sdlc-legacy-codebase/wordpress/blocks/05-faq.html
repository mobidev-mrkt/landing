<!-- wp:acf/block-faq {"name":"acf/block-faq","data":{"field_688be43c32be9":"faq","field_67e95476e3049":"<h2><b>FAQ</b></h2>","field_67e95476ea58f":{"row-0":{"field_67e95476f230e":"<h3><b>Do we lose control of our codebase if a vendor uses AI?</b><span style="font-weight: 400;"> </span></h3>","field_67e9547701ad6":"<span style="font-weight: 400;">Not if the vendor works safely. Check four things: enterprise AI environments where your code isn't used for model training, AI security training and NDAs for engineers, senior engineers reviewing every AI output, and AI security scanning in the CI/CD pipeline.</span>"},"row-1":{"field_67e95476f230e":"<h3><b>How do you control AI token and compute costs?</b></h3>","field_67e9547701ad6":"<span style="font-weight: 400;">Match the model to the task: cheap, fast models for simple edits and top-tier models for architecture and complex debugging. Keep sessions short and start a new one for each task. Track usage in provider dashboards, and batch API calls at the architecture level.</span>"},"row-2":{"field_67e95476f230e":"<h3>Can AI help apply "Working Effectively with Legacy Code" by Michael Feathers?</h3>","field_67e9547701ad6":"<span style="font-weight: 400;">Yes. Feathers defines legacy code as code without tests, and AI can generate characterization and unit tests. But AI tends to write tests that pass. Use human review and mutation testing to check that the tests actually catch failures.</span>"},"row-3":{"field_67e95476f230e":"<h3>Is AI development actually faster than standard practices?</h3>","field_67e9547701ad6":"<span style="font-weight: 400;">Yes, when AI covers the whole SDLC. Applied to coding alone, it speeds up code generation by 30-40%, while review and QA can slow down by 50%, so time-to-market stays flat or gets worse.</span>"},"row-4":{"field_67e95476f230e":"<h3>What should executives expect when starting AI SDLC?</h3>","field_67e9547701ad6":"<span style="font-weight: 400;">A temporary slowdown while processes are set up, then real gains. Clean up legacy code first, apply AI across all five stages, budget for tooling and infrastructure, and expect AI model pricing to change.</span>"}},"field_688be4d232bec":"1","field_68c9f1a0faqcta1":"0"},"mode":"preview"} /-->
