<!-- wp:acf/block-faq {"name":"acf/block-faq","data":{"field_688be43c32be9":"faq","field_67e95476e3049":"\\u003ch2\\u003e\\u003cb\\u003eFAQ\\u003c/b\\u003e\\u003c/h2\\u003e","field_67e95476ea58f":{"row-0":{"field_67e95476f230e":"\\u003ch3\\u003e\\u003cb\\u003eDo we lose control of our codebase if a vendor uses AI?\\u003c/b\\u003e\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003e \\u003c/span\\u003e\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eNot if the vendor works safely. Check four things: enterprise AI environments where your code isn't used for model training, AI security training and NDAs for engineers, senior engineers reviewing every AI output, and AI security scanning in the CI/CD pipeline.\\u003c/span\\u003e"},"row-1":{"field_67e95476f230e":"\\u003ch3\\u003e\\u003cb\\u003eHow do you control AI token and compute costs?\\u003c/b\\u003e\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eMatch the model to the task: cheap, fast models for simple edits and top-tier models for architecture and complex debugging. Keep sessions short and start a new one for each task. Track usage in provider dashboards, and batch API calls at the architecture level.\\u003c/span\\u003e"},"row-2":{"field_67e95476f230e":"\\u003ch3\\u003eCan AI help apply \\u0022Working Effectively with Legacy Code\\u0022 by Michael Feathers?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eYes. Feathers defines legacy code as code without tests, and AI can generate characterization and unit tests. But AI tends to write tests that pass. Use human review and mutation testing to check that the tests actually catch failures.\\u003c/span\\u003e"},"row-3":{"field_67e95476f230e":"\\u003ch3\\u003eIs AI development actually faster than standard practices?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eYes, when AI covers the whole SDLC. Applied to coding alone, it speeds up code generation by 30-40%, while review and QA can slow down by 50%, so time-to-market stays flat or gets worse.\\u003c/span\\u003e"},"row-4":{"field_67e95476f230e":"\\u003ch3\\u003eWhat should executives expect when starting AI SDLC?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eA temporary slowdown while processes are set up, then real gains. Clean up legacy code first, apply AI across all five stages, budget for tooling and infrastructure, and expect AI model pricing to change.\\u003c/span\\u003e"}},"field_688be4d232bec":"1","field_68c9f1a0faqcta1":"0"},"mode":"preview"} /-->
