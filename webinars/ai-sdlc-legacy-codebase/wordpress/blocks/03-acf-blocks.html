<!-- wp:acf/block-cards-with-icon {"name":"acf/block-cards-with-icon","data":{"field_68d820c4c978c":"","field_68d820c4c982c":"\\u003ch2\\u003eWhat You'll Take Away\\u003c/h2\\u003e","field_68d82093a9052":"\\u003cp\\u003e\\u003cbr data-mce-bogus=\\u00221\\u0022\\u003e\\u003c/p\\u003e","field_68d820c4c987d":{"row-0":{"field_68d820aea9053":"56058","field_68d820c5189b4":"\\u003ch3\\u003eWhy AI on legacy code can slow you down,\\u003c/h3\\u003e","field_68d820c5189f8":"\\u003cp\\u003e\\u003cspan style=\\u0022font-weight: 400;\\u0022 data-mce-style=\\u0022font-weight: 400;\\u0022\\u003eand why refactoring comes before new features.\\u003c/span\\u003e\\u003c/p\\u003e"},"row-1":{"field_68d820aea9053":"56059","field_68d820c5189b4":"\\u003ch3\\u003eA 4-step setup for AI on old PHP and .NET code:\\u003c/h3\\u003e","field_68d820c5189f8":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003efull repository context, rules files, characterization tests, and small batches.\\u003c/span\\u003e"},"row-2":{"field_68d820aea9053":"56060","field_68d820c5189b4":"\\u003ch3\\u003eThe AI adoption curve:\\u003c/h3\\u003e","field_68d820c5189f8":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003ewhy teams get slower before they get faster, and how to tell which stage you are in.\\u003c/span\\u003e"},"row-3":{"field_68d820aea9053":"56062","field_68d820c5189b4":"\\u003ch3\\u003eA real legacy\\r\\nmodernization case:\\u003c/h3\\u003e","field_68d820c5189f8":"81% less delivery effort over 12 months."}},"field_68e82aa021aa2":"grey"},"mode":"edit"} /-->

<!-- wp:acf/block-faq {"name":"acf/block-faq","data":{"field_688be43c32be9":"Key Answers from the Webinar ","field_67e95476e3049":"\\u003ch2\\u003eKey Answers from the Webinar\\u003c/h2\\u003e","field_67e95476ea58f":{"row-0":{"field_67e95476f230e":"\\u003ch3\\u003eWhat is AI-driven SDLC?\\u003c/h3\\u003e","field_67e9547701ad6":"AI SDLC means AI in all five stages of the software development lifecycle: business analysis and specs, architecture, development, QA, and deployment."},"row-1":{"field_67e95476f230e":"\\u003ch3\\u003eIs AI-driven SDLC real or just a buzzword?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eOften, yes, it's a buzzword, if a development company talks about the share of code written by AI or licenses bought, that's marketing. If it can show written specs before generation, context files in the repository, and reviewers who own them, it's real.\\u003c/span\\u003e"},"row-2":{"field_67e95476f230e":"\\u003ch3\\u003eOur competitors ship features faster. How do we catch up with AI?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eDevelopers got faster, but delivery didn't, because specs, QA, and code review became the bottleneck. Find the bottleneck stage first. When AI speeds up coding alone, QA can't keep up, specs arrive late, and code review grows when AI writes 500 lines instead of 100. Competitors building from scratch also move faster at first than teams on legacy code.\\u003c/span\\u003e"},"row-3":{"field_67e95476f230e":"\\u003ch3\\u003eWhy does AI raise cost per feature on a legacy software codebase?\\u003c/h3\\u003e","field_67e9547701ad6":"\\u003cspan style=\\u0022font-weight: 400;\\u0022\\u003eNew features built on top of unrefactored legacy code create bugs, tangled dependencies, and slow reviews. Plan and budget AI-assisted refactoring first; feature work with AI gets much faster after that.\\u003c/span\\u003e"},"row-4":{"field_67e95476f230e":"\\u003ch3\\u003eCan AI understand a 15-year-old PHP codebase or migrate legacy .NET?\\u003c/h3\\u003e","field_67e9547701ad6":"Yes, but only with the right setup. Out of the box, AI guesses convincingly. Four steps make it safe:\\r\\n\\u003cul\\u003e\\r\\n \\t\\u003cli\\u003eGive the agent the whole repository, not a pasted file.\\u003c/li\\u003e\\r\\n \\t\\u003cli\\u003eAdd rules files such as AGENTS.md (for example, \\u0022PHP 5, no Composer, global variables are intentional\\u0022).\\u003c/li\\u003e\\r\\n \\t\\u003cli\\u003eRecord current behavior with characterization tests before changing code.\\u003c/li\\u003e\\r\\n \\t\\u003cli\\u003eMigrate one endpoint, agree on the pattern, then repeat in small reviewable batches.\\u003c/li\\u003e\\r\\n\\u003c/ul\\u003e"},"row-5":{"field_67e95476f230e":"\\u003ch3\\u003eWe bought AI coding licenses and got slower. What went wrong?\\u003c/h3\\u003e","field_67e9547701ad6":"AI coding adoption follows a curve: initial hype with falling quality, a temporary slowdown while the team adds structure such as spec-driven development, then real speed gains. Applied to coding alone, AI speeds up code generation by 30–40% but can slow review and QA by up to 50%."},"row-6":{"field_67e95476f230e":"\\u003ch3\\u003eHow can AI help when documentation is gone?\\u003c/h3\\u003e","field_67e9547701ad6":"Reverse the order: let AI read the codebase and document roles, data flows, and business rules first. On one MobiDev project, this showed that about 50% of the code was dead and the \\u0022simple\\u0022 service had 15 user roles."}},"field_688be4d232bec":"1","field_68c9f1a0faqcta1":"1","field_68c9f1a0faqcta2":"Can't Find Your Answer?","field_68c9f1a0faqcta3":"Get your AI readiness level free!","field_68c9f1a0faqcta4":{"title":"Watch The Full Recording","url":"#recording","target":""},"field_68c9f1a0faqcta5":"image","field_68c9f1a0faqcta6":"57819"},"mode":"preview"} /-->

<!-- wp:acf/block-author {"name":"acf/block-author","data":{"field_6887e58a7da0d":"Moderator's insight","field_6887e5af7da0e":"54545","field_6887e5d07da0f":"18160","field_6887e62c7da10":"\\u003ch2\\u003eModerator's insight\\u003c/h2\\u003e","field_6887e6cd7da11":"\\u003csection class=\\u0022grey\\u0022\\u003e\\r\\n\\u003cdiv class=\\u0022wrap\\u0022\\u003e\\r\\n\\u003cdiv class=\\u0022mod\\u0022\\u003e\\r\\n\\r\\n\\u0022I kept hearing the same tension from founders: everyone said ship faster with AI, but nobody wanted to be the team that broke production doing it. That was exactly the debate I wanted on stage, delivery versus product, speed versus what actually holds up.\\u0022\\r\\n\\r\\n\\u003c/div\\u003e\\r\\n\\u003c/div\\u003e\\r\\n\\u003c/section\\u003e"},"mode":"edit"} /-->
